name: Build and publish Docker image

on:
  push:
    branches: [main]
    paths:
      - "FPTU.Capstone.AMKCollective/**"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./FPTU.Capstone.AMKCollective/FPTU.Capstone.AMKCollective.Api
          file: ./FPTU.Capstone.AMKCollective/FPTU.Capstone.AMKCollective.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fptu-capstone-amkcollective:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fptu-capstone-amkcollective:${{ github.sha }}
