name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - develop
      - developer
    paths:
      - "FPTU.Capstone.AMKCollective.Api/**"
      - "FPTU.Capstone.AMKCollective.Application/**"
      - "FPTU.Capstone.AMKCollective.Domain/**"
      - "FPTU.Capstone.AMKCollective.Infrastructure/**"
      - ".github/workflows/docker-publish.yml"

  pull_request:
    branches:
      - developer
      - develop
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE_NAME: fptu-capstone-amkcollective

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      # Generate appsettings.Production.json with actual secrets
      # This file is baked into the Docker image so FE team can just docker run
      - name: Generate appsettings.Production.json
        run: |
          cat > FPTU.Capstone.AMKCollective.Api/appsettings.Production.json << 'ENDJSON'
          {
            "ConnectionStrings": {
              "DefaultConnection": "Server=${{ secrets.DB_HOST }};Port=${{ secrets.DB_PORT }};Database=${{ secrets.DB_NAME }};Uid=${{ secrets.DB_USER }};Pwd=${{ secrets.DB_PASSWORD }};SslMode=Required;TreatTinyAsBoolean=true;"
            },
            "JwtSettings": {
              "SecretKey": "${{ secrets.JWT_SECRET_KEY }}",
              "Issuer": "${{ secrets.JWT_ISSUER }}",
              "Audience": "${{ secrets.JWT_AUDIENCE }}",
              "ExpireMinutes": ${{ secrets.JWT_EXPIRE_MINUTES || '120' }}
            },
            "CloudinarySettings": {
              "CloudName": "${{ secrets.CLOUDINARY_CLOUD_NAME }}",
              "ApiKey": "${{ secrets.CLOUDINARY_API_KEY }}",
              "ApiSecret": "${{ secrets.CLOUDINARY_API_SECRET }}"
            },
            "RedisSettings": {
              "ConnectionString": "${{ secrets.REDIS_CONNECTION_STRING }}",
              "InstanceName": "${{ secrets.REDIS_INSTANCE_NAME || 'Ameko' }}"
            },
            "EmailSettings": {
              "From": "${{ secrets.EMAIL_FROM }}",
              "SmtpServer": "${{ secrets.EMAIL_SMTP_SERVER || 'smtp.gmail.com' }}",
              "Port": ${{ secrets.EMAIL_PORT || '587' }},
              "Username": "${{ secrets.EMAIL_USERNAME }}",
              "Password": "${{ secrets.EMAIL_PASSWORD }}"
            },
            "Cors": {
              "AllowedOrigins": [
                "${{ secrets.CORS_ALLOWED_ORIGINS || 'http://localhost:3000' }}"
              ]
            }
          }
          ENDJSON

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FPTU.Capstone.AMKCollective.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            CONFIGURATION=Release

      - name: Comment PR with image tags
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tags = `${{ steps.meta.outputs.tags }}`.split('\n');
            const comment = `🐳 **Docker Image Published Successfully!**\n\nYou can pull this image using:\n\n${tags.map(tag => `\`\`\`bash\ndocker pull ${tag}\n\`\`\``).join('\n\n')}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Create .env file for Docker
        run: |
          cat > .env << EOF
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_NAME=${{ secrets.DB_NAME }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          JWT_ISSUER=${{ secrets.JWT_ISSUER }}
          JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE }}
          JWT_EXPIRE_MINUTES=${{ secrets.JWT_EXPIRE_MINUTES }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          REDIS_CONNECTION_STRING=${{ secrets.REDIS_CONNECTION_STRING }}
          REDIS_INSTANCE_NAME=${{ secrets.REDIS_INSTANCE_NAME }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EMAIL_SMTP_SERVER=${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_PORT=${{ secrets.EMAIL_PORT }}
          EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
          CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
          ASPNETCORE_ENVIRONMENT=Production
          EOF

      - name: Upload .env as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-env-${{ github.sha }}
          path: .env
          retention-days: 7
