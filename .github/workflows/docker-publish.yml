name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - develop
      - developer
    paths:
      - "FPTU.Capstone.AMKCollective.Api/**"
      - "FPTU.Capstone.AMKCollective.Application/**"
      - "FPTU.Capstone.AMKCollective.Domain/**"
      - "FPTU.Capstone.AMKCollective.Infrastructure/**"
      - ".github/workflows/docker-publish.yml"

  pull_request:
    branches:
      - developer
      - develop
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch: # Allow manual trigger

env:
  DOCKER_IMAGE_NAME: fptu-capstone-amkcollective

jobs:
  build-and-push:
    # Always run on push; for PRs, only run when base branch is developer/develop.
    if: ${{ github.event_name != 'pull_request' ||github.base_ref == 'develop' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FPTU.Capstone.AMKCollective.Api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            CONFIGURATION=Release

      - name: Comment PR with image tags
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const tags = `${{ steps.meta.outputs.tags }}`.split('\n');
            const comment = `🐳 **Docker Image Published Successfully!**\n\nYou can pull this image using:\n\n${tags.map(tag => `\`\`\`bash\ndocker pull ${tag}\n\`\`\``).join('\n\n')}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
